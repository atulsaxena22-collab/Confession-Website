<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Confession Admin</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <header class="navbar">

        <div class="logo">
            💌 Confession Admin
        </div>

        <a
            href="/"
            class="nav-btn"
        >
            View Website
        </a>

    </header>


    <main class="admin-page">

        <section class="admin-header">

            <span class="badge">
                💭 Private Dashboard
            </span>

            <h1>
                Submitted Confessions
            </h1>

            <p>
                All submitted confessions are shown here.
            </p>

        </section>


        <section class="admin-container">

            <div class="admin-top">

                <h2>
                    All Confessions
                </h2>

                <button
                    class="refresh-btn"
                    onclick="loadConfessions()"
                >
                    ↻ Refresh
                </button>

            </div>


            <div id="confessionsList">

                <div class="loading">
                    Loading confessions...
                </div>

            </div>

        </section>

    </main>


    <script src="admin.js"></script>

</body>

</html>
